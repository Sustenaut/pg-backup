# Written by `pubrules sync` from the ci block of pubrules.json. Do not edit:
# change pubrules.json and run `pubrules sync`.
name: pr

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  # Whether an earlier run already passed on this commit's tree: then the
  # jobs it ran are skipped, and nothing here tests less than it did.
  tested:
    name: ci
    uses: Sustenaut/pubrules/.github/workflows/job-tested.yml@36b8b556ff838eb1e24c4e995350f10fdbdf26f3 # v0.45.0
    with: {"workflow": ".github/workflows/pr.yml"}
    permissions:
      actions: read
      contents: read

  functional:
    name: ci
    needs: [tested]
    if: ${{ needs.tested.outputs.tested != 'true' }}
    uses: Sustenaut/pubrules/.github/workflows/job-python-functional.yml@36b8b556ff838eb1e24c4e995350f10fdbdf26f3 # v0.45.0

  audit:
    name: ci
    needs: [tested]
    if: ${{ needs.tested.outputs.tested != 'true' }}
    uses: Sustenaut/pubrules/.github/workflows/job-python-audit.yml@36b8b556ff838eb1e24c4e995350f10fdbdf26f3 # v0.45.0

  osv:
    name: ci
    needs: [tested]
    if: ${{ needs.tested.outputs.tested != 'true' }}
    uses: Sustenaut/pubrules/.github/workflows/job-osv.yml@36b8b556ff838eb1e24c4e995350f10fdbdf26f3 # v0.45.0

  review:
    name: ci
    needs: [tested]
    if: ${{ needs.tested.outputs.tested != 'true' }}
    uses: Sustenaut/pubrules/.github/workflows/job-review.yml@36b8b556ff838eb1e24c4e995350f10fdbdf26f3 # v0.45.0

  sonar:
    name: ci
    needs: [tested, functional]
    if: ${{ github.event_name != 'merge_group' && needs.tested.outputs.tested != 'true' }}
    uses: Sustenaut/pubrules/.github/workflows/job-sonar.yml@36b8b556ff838eb1e24c4e995350f10fdbdf26f3 # v0.45.0
    with: {"reports": "sonar.python.coverage.reportPaths=*.xml", "layout": "-Dsonar.sources=src -Dsonar.tests=tests"}
    secrets: { SONAR_TOKEN: '${{ secrets.SONAR_TOKEN }}' }

  # The one check a ruleset requires: it passes only when every job
  # above succeeded or, where an earlier run already passed on the
  # commit's tree, was skipped for it, or is the scan, which the merge
  # queue never runs. None is skipped for not being asked for.
  passed:
    name: ci / passed
    if: always()
    needs: [tested, functional, audit, osv, review, sonar]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "$RESULTS"
          echo "$RESULTS" | jq -e --arg tested "$TESTED" --arg event "$EVENT" '.tested.result == "success"
            and all(to_entries[]; .value.result == "success" or (.value.result == "skipped"
              and ($tested == "true" or (.key == "sonar" and $event == "merge_group"))))' > /dev/null
        env: { RESULTS: '${{ toJSON(needs) }}', TESTED: '${{ needs.tested.outputs.tested }}', EVENT: '${{ github.event_name }}' }

  # pubrel's release workflow: on a pull request, a code change records
  # what it changes and a release is the bump its changes require; on
  # main, a published version is tagged and released.
  release:
    needs: passed
    if: ${{ !cancelled() && needs.passed.result == 'success' }}
    uses: Sustenaut/pubrel/.github/workflows/release.yml@931f3016d6fec63315e413060cde079d77730b52 # v0.7.0
    with: {"pubrel-version": "v0.7.0"}
    secrets: { RELEASE_APP_ID: '${{ secrets.RELEASE_APP_ID }}', RELEASE_APP_KEY: '${{ secrets.RELEASE_APP_KEY }}' }
    permissions:
      contents: write
