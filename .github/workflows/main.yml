# Written by `pubrules sync` from the ci block of pubrules.json. Do not edit:
# change pubrules.json and run `pubrules sync`.
name: main

on:
  push: { branches: [main] }

permissions:
  contents: read

jobs:
  # Whether an earlier run already passed on this commit's tree: then the
  # jobs it ran are skipped, and nothing here tests less than it did.
  tested:
    name: ci
    uses: Sustenaut/pubrules/.github/workflows/job-tested.yml@2fe559caa00c029d9be864faa7f7cc20cd234d0e # v0.43.0
    with: {"workflow": ".github/workflows/pr.yml"}
    permissions:
      actions: read
      contents: read

  functional:
    name: ci
    needs: [tested]
    if: ${{ needs.tested.outputs.tested != 'true' }}
    uses: Sustenaut/pubrules/.github/workflows/job-python-functional.yml@2fe559caa00c029d9be864faa7f7cc20cd234d0e # v0.43.0

  audit:
    name: ci
    needs: [tested]
    if: ${{ needs.tested.outputs.tested != 'true' }}
    uses: Sustenaut/pubrules/.github/workflows/job-python-audit.yml@2fe559caa00c029d9be864faa7f7cc20cd234d0e # v0.43.0

  osv:
    name: ci
    needs: [tested]
    if: ${{ needs.tested.outputs.tested != 'true' }}
    uses: Sustenaut/pubrules/.github/workflows/job-osv.yml@2fe559caa00c029d9be864faa7f7cc20cd234d0e # v0.43.0

  sonar:
    name: ci
    needs: [tested, functional]
    if: ${{ !failure() && !cancelled() }}
    uses: Sustenaut/pubrules/.github/workflows/job-sonar.yml@2fe559caa00c029d9be864faa7f7cc20cd234d0e # v0.43.0
    permissions:
      actions: read
      contents: read
    with: {"reports": "sonar.python.coverage.reportPaths=*.xml", "layout": "-Dsonar.sources=src -Dsonar.tests=tests", "coverage-run": "${{ needs.tested.outputs.run-id }}"}
    secrets: { SONAR_TOKEN: '${{ secrets.SONAR_TOKEN }}' }

  # The one check a ruleset requires: it passes only when every job
  # above succeeded or, where an earlier run already passed on the
  # commit's tree, was skipped for it. None is skipped for not being asked for.
  passed:
    name: ci / passed
    if: always()
    needs: [tested, functional, audit, osv, sonar]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "$RESULTS"
          echo "$RESULTS" | jq -e --arg tested "$TESTED" '.tested.result == "success"
            and all(.[]; .result == "success" or (.result == "skipped" and $tested == "true"))' > /dev/null
        env: { RESULTS: '${{ toJSON(needs) }}', TESTED: '${{ needs.tested.outputs.tested }}' }

  # pubrel's release workflow: on a pull request, a code change records
  # what it changes and a release is the bump its changes require; on
  # main, a published version is tagged and released.
  release:
    needs: passed
    if: ${{ !cancelled() && needs.passed.result == 'success' }}
    uses: Sustenaut/pubrel/.github/workflows/release.yml@931f3016d6fec63315e413060cde079d77730b52 # v0.7.0
    with: {"pubrel-version": "v0.7.0"}
    secrets: { RELEASE_APP_ID: '${{ secrets.RELEASE_APP_ID }}', RELEASE_APP_KEY: '${{ secrets.RELEASE_APP_KEY }}' }
    permissions:
      contents: write
